# Consumes ResourceClaim hcu-claim-basic. Requires kubelet + runtime CDI so injected
# CDI devices apply (same bind mounts as k8s-hcu-plugin-v2 Allocate, generated by the driver).
apiVersion: v1
kind: Pod
metadata:
  name: hcu-consumer
  namespace: hcu-dra-test
spec:
  restartPolicy: Never
  resourceClaims:
    - name: hcu-claim-ref
      resourceClaimName: hcu-claim-basic
  containers:
    - name: app
      image: ubuntu:22.04
      command: ["sleep", "infinity"]
      resources:
        claims:
          - name: hcu-claim-ref
